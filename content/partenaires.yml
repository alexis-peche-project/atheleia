projets:
  titre: Des athlètes, des projets.
  liste:
  - ancre: johan-nigon
    image: assets/img/nigon-casque.webp
    etiquette: Moto endurance
    titre: 'Johan Nigon : préparer 2027 dès la fin du Bol d''Or.'
    texte: Le Bol d'Or, plus ancienne course de 24 heures au monde, clôt la saison d'endurance. Pour un pilote, c'est le moment d'analyser ce qui a fonctionné et de prospecter les partenaires de la saison suivante.
