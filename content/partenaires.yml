    etiquette: Course à pied · Défi solidaire
    titre: 'Davy Sénécail : relier Nice à Lille en courant.'
    texte: Un défi de 15 jours pour parler des maladies mentales, avec l'association Bipolarité France. Une tombola accompagne l'aventure, et les entreprises peuvent rejoindre le projet comme partenaires.
