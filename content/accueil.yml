temoignage:
  texte: Je recommande sincèrement Athèleia à toute entreprise qui souhaite s'engager dans le sponsoring sportif local de manière simple, humaine et bien accompagnée.
  auteur: Thierry Privat
  role: Agent général AXA Prévoyance & Patrimoine, partenaire du Nice Volley-Ball
cercle:
  phrase: Vous ne sponsorisez pas seulement un sport. Vous vous associez aux émotions qu'il génère.
  image: assets/img/volley-equipe.webp
